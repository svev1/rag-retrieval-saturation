# Parameters for the BM25 smoke run.

experiment: bm25_smoke
date: 2026-05-17

# Smoke slice
query_ids: [24, 31, 32, 52]
n_distractors: 500
seed: 42
k: 10  # top-k inspected per query

# Retriever
retriever: bm25
library: rank_bm25
bm25_variant: Okapi
bm25_params:
  k1: 1.5   # rank_bm25 default
  b: 0.75   # rank_bm25 default

# Tokenization
tokenizer: nltk_word_regex
lowercase: true
stopwords: nltk_english
indexed_fields: [title, description, main_content]
