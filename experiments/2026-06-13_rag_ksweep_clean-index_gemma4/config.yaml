# Parameters for the M2 RAG k-sweep -- clean-index, gemma4:e4b generator variant.
#
# Same retrieval + clean text as 2026-06-09_rag_ksweep_clean-index; only the
# GENERATOR changes (gemma2:9b -> gemma4:e4b). So this cache vs the gemma2 clean
# cache isolates the effect of the generator model, with everything upstream
# (run files, doc_text_source, topics, k, prompt, char_cap) held identical.
#
# gemma4:e4b is an 8B reasoning model (9.6 GB, Q4_K_M). Two consequences:
#   - think: false  -> answer directly; otherwise it spends num_predict on hidden
#                      reasoning and Ollama returns an empty `response`.
#   - no num_gpu     -> 9.6 GB does not fit 8 GB VRAM, so let Ollama auto-offload
#                      (forcing layers risks OOM). Runs partly on CPU -> slow.
#   - request_timeout: 1800 -> large-k (k=50) prompts are big and CPU prompt-eval
#                      is slow; 300s would time out on the deepest cutoffs.

experiment: m2_ksweep_clean-index_gemma4
date: 2026-06-13

# Full evaluation set: all 28 judged topics.
topic_ids: [3, 4, 7, 8, 13, 15, 16, 18, 20, 23, 24, 31, 32, 34, 39, 42, 43, 44, 46, 48, 52, 54, 58, 60, 64, 68, 69, 74]
retrievers: [bm25_clean, dense]
k_values: [1, 3, 5, 10, 20, 50]

# Document text fed to the generator: the clean default_text() (matches dense).
doc_text_source: clean

# Generator (local, via Ollama HTTP API)
model: gemma4:e4b
think: false            # reasoning model -> answer directly, not via hidden CoT
request_timeout: 1800   # seconds; CPU prompt-eval on big k=50 prompts is slow
options:
  temperature: 0        # deterministic -> cacheable, reproducible answers
  seed: 42
  num_ctx: 8192         # prompt + answer budget
  num_predict: 512      # answer room reserved inside num_ctx
                        # NOTE: no num_gpu -> Ollama auto-fits the 9.6 GB model

# Context building
char_cap: 500           # per-document front-truncation (identical to gemma2 run)
prompt_template_version: 1
