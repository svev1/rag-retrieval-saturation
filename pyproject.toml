[project]
name = "ows-retrieval"
version = "0.1.0"
description = "BM25 vs FAISS+Jina V3 retrieval evaluation on the ows-curlie-2025 / radboud-val split."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sveva Nemeth" }
]
dependencies = [
  "pandas",
  "pyarrow",
  "numpy",
  "jupyter",
  "rank_bm25",
  "ir_measures",
  "nltk",
  # Dense retrieval (Milestone 1 — Part 2)
  "faiss-cpu",
  "transformers",
  "torch",
  "einops",
  "sentencepiece",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
